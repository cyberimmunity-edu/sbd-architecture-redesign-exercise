version: 1
system:
  name: "Безэкипажное судно-доставщик"
  description: "Пример 2: автономная доставка грузов в речной акватории"
blocks:
  - id: blk-gps-ins
    name: "01. Навигация GPS/INS"
    cost: 3
    position: { x: 530, y: 80 }
  - id: blk-cam
    name: "02. Камера (техническое зрение)"
    cost: 2
    position: { x: 530, y: 548 }
  - id: blk-lidar
    name: "03. Лидар"
    cost: 2
    position: { x: 530, y: 782 }
  - id: blk-nav
    name: "04. Навигационный вычислитель"
    cost: 4
    position: { x: 1370, y: 314 }
  - id: blk-vision
    name: "05. Анализ видеопотока"
    cost: 3
    position: { x: 950, y: 548 }
  - id: blk-ota
    name: "06. Подсистема OTA-обновления"
    cost: 3
    position: { x: 950, y: 314 }
  - id: blk-ai
    name: "07. Бортовой ИИ (оценка обстановки и планирование маршрута)"
    cost: 5
    position: { x: 1790, y: 197 }
  - id: blk-avoid
    name: "08. Подсистема расхождения"
    cost: 3
    position: { x: 2210, y: 197 }
  - id: blk-cargo
    name: "09. Контроль груза и выгрузки"
    cost: 2
    position: { x: 1790, y: 431 }
  - id: blk-radio
    name: "10. Радиосвязь"
    cost: 2
    position: { x: 530, y: 314 }
  - id: ext-shore
    name: "Береговой пост (СУДС)"
    cost: 0
    external: true
    trusted: true
    position: { x: 80, y: 373 }
  - id: ext-lock
    name: "Оператор шлюза"
    cost: 0
    external: true
    position: { x: 2660, y: 314 }
edges:
  - id: e-shore-radio
    from: ext-shore
    to: blk-radio
    label: "судоходная обстановка"
  - id: e-lock-radio
    from: ext-lock
    to: blk-radio
    label: "разрешение шлюзования"
  - id: e-radio-nav
    from: blk-radio
    to: blk-nav
    label: "очищенные данные"
  - id: e-radio-ota
    from: blk-radio
    to: blk-ota
    label: "пакеты обновлений (OTA)"
  - id: e-radio-lock
    from: blk-radio
    to: ext-lock
    label: "заявка на шлюзование"
  - id: e-gps-nav
    from: blk-gps-ins
    to: blk-nav
    label: "навигационное решение"
  - id: e-cam-vision
    from: blk-cam
    to: blk-vision
    label: "видеопоток"
  - id: e-lidar-vision
    from: blk-lidar
    to: blk-vision
    label: "облако точек"
  - id: e-vision-ai
    from: blk-vision
    to: blk-ai
    label: "распознанная обстановка"
  - id: e-nav-ai
    from: blk-nav
    to: blk-ai
    label: "данные курса и позиции"
  - id: e-ai-avoid
    from: blk-ai
    to: blk-avoid
    label: "план манёвра"
  - id: e-avoid-nav
    from: blk-avoid
    to: blk-nav
    label: "корректировка маршрута"
  - id: e-nav-cargo
    from: blk-nav
    to: blk-cargo
    label: "маршрутный лист"
  - id: e-cargo-shore
    from: blk-cargo
    to: ext-shore
    label: "статус груза"
  - id: e-ota-nav
    from: blk-ota
    to: blk-nav
    label: "установленная прошивка"
  - id: e-ota-ai
    from: blk-ota
    to: blk-ai
    label: "обновление моделей ИИ"
