security:
  assumptions:
    - id: asm-bnk
      text: >-
        Аутентичный банк (BNK) является благонадёжным: подписанные им подтверждения оплаты достоверны, а ключ проверки
        его подписи заранее известен REG
    - id: asm-pmi
      text: >-
        Требования и ПМИ разработаны благонадёжными и компетентными специалистами: прошивка, прошедшая все обязательные
        проверки ПМИ, удовлетворяет требованиям
  goals:
    - id: g-cert-issue
      name: Выдача сертификатов после проверок
      description: >-
        При любых обстоятельствах сертификаты безопасности выдаются только после успешной проверки всех требований к
        заявке
      unconditional: true
    - id: g-key-access
      name: Защита ключа подписи REG
      description: При любых обстоятельствах только авторизованные пользователи имеют доступ к закрытому ключу подписи REG
      unconditional: true
    - id: g-registry-actual
      name: Актуальность сведений о допусках
      description: 'Сведения о допусках, которые выдаёт REG, соответствуют состоянию реестра на момент запроса'
    - id: g-conf-materials
      name: Конфиденциальность материалов заявок
      description: При любых обстоятельствах только авторизованные пользователи имеют доступ к конфиденциальным материалам заявок
      unconditional: true
    - id: g-pmi-checks
      name: Полнота испытаний по ПМИ
      description: При любых обстоятельствах выполняются все обязательные согласно ПМИ проверки
      unconditional: true
    - id: g-prepaid
      name: Предоплата заявок
      description: При любых обстоятельствах обрабатываются только предварительно оплаченные заявки на допуски
      unconditional: true
    - id: g-status-authz
      name: Авторизованное изменение статусов допусков
      description: При любых обстоятельствах статусы допусков изменяются только по авторизованным решениям REG
      unconditional: true
  functions:
    - id: fn-payment-auth
      name: Контроль подлинности подтверждения оплаты
      cost: 2
      implements:
        - goal: g-prepaid
          weight: mandatory
    - id: fn-notice-auth
      name: Контроль подлинности уведомлений о нарушениях
      cost: 2
      implements:
        - goal: g-status-authz
          weight: mandatory
    - id: fn-cert-authz
      name: Авторизация решений о допусках
      cost: 3
      implements:
        - goal: g-cert-issue
          weight: mandatory
        - goal: g-status-authz
          weight: mandatory
    - id: fn-pmi-control
      name: Контроль полноты проверок по ПМИ
      cost: 4
      implements:
        - goal: g-pmi-checks
          weight: mandatory
        - goal: g-cert-issue
          weight: mandatory
    - id: fn-sec-tests
      name: Проверка прошивки на соответствие требованиям безопасности
      cost: 4
      implements:
        - goal: g-pmi-checks
          weight: mandatory
    - id: fn-result-integrity
      name: Контроль целостности результатов испытаний
      cost: 2
      implements:
        - goal: g-pmi-checks
          weight: optional
        - goal: g-cert-issue
          weight: optional
    - id: fn-sign
      name: Цифровая подпись исходящих данных
      cost: 2
      implements:
        - goal: g-registry-actual
          weight: mandatory
        - goal: g-cert-issue
          weight: optional
    - id: fn-key-access
      name: Контроль доступа к ключу подписи
      cost: 3
      implements:
        - goal: g-key-access
          weight: mandatory
    - id: fn-registry
      name: Контроль целостности реестра допусков
      cost: 3
      implements:
        - goal: g-registry-actual
          weight: mandatory
        - goal: g-status-authz
          weight: optional
    - id: fn-conf-access
      name: Контроль доступа к материалам заявок
      cost: 3
      implements:
        - goal: g-conf-materials
          weight: mandatory
assignments:
  - function: fn-payment-auth
    block: blk-payment
  - function: fn-notice-auth
    block: blk-notice
  - function: fn-cert-authz
    block: blk-decision
  - function: fn-registry
    block: blk-registry
  - function: fn-sign
    block: blk-esign
  - function: fn-key-access
    block: blk-esign
  - function: fn-conf-access
    block: blk-store
  - function: fn-pmi-control
    block: blk-test-mgmt
  - function: fn-result-integrity
    block: blk-result-gate
  - function: fn-sec-tests
    block: blk-sec-tests
