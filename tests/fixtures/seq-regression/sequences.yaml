version: 1
domains:
  blk-gps-ins: 01. Навигация GPS/INS
  blk-cam: 02. Камера (техническое зрение)
  blk-lidar: 03. Лидар
  blk-nav: 04. Навигационный вычислитель
  blk-vision: 05. Анализ видеопотока
  blk-ota: 06. Подсистема OTA-обновления
  blk-ai: 07. Бортовой ИИ (оценка обстановки и планирование маршрута)
  blk-avoid: 08. Подсистема расхождения
  blk-cargo: 09. Контроль груза и выгрузки
  blk-radio: 10. Радиосвязь
  ext-shore: Береговой пост (СУДС) (внешняя)
  ext-lock: Оператор парка БЭСД (внешняя)
  dom-1: 11. Контроль AIS
  dom-2: 12. Контроль миссии
  dom-3: 13. Контроль положения
  dom-4: 14. Аварийный уход от столкновения
  dom-5: 15. Верификация и применение обновления прошивки
  dom-6: 16. Выполнение критичных команд
  dom-cargo-cmd: 17. Контроль привода выгрузки
  dom-7: 18. События безопасности
  dom-8: 19. Блокировка движения
  ext-1: Внешняя среда (внешняя)
  ext-2: Радиоэфир (внешняя)
sequences:
  - id: seq-1
    name: Удалённое обновление прошивки
    lifelines:
      - ext-shore
      - ext-2
      - blk-radio
      - blk-ota
      - dom-5
      - blk-nav
      - blk-ai
    arrows:
      - id: a-10
        from: ext-shore
        to: ext-2
        label: команда удалённого обновления прошивки
      - id: a-11
        from: ext-2
        to: blk-radio
        label: команда удалённого обновления прошивки
      - id: a-2
        from: blk-radio
        to: blk-ota
        label: передача пакета образа (OTA)
      - id: a-3
        from: blk-ota
        to: dom-5
        label: передача образа на верификацию
      - id: a-4
        from: dom-5
        to: dom-5
        label: проверка подписи и верификация прошивки
      - id: a-5
        from: blk-ota
        to: blk-nav
        label: ввод прошивки в работу
      - id: a-6
        from: blk-ota
        to: blk-ai
        label: обновление моделей ИИ
      - id: a-7
        from: blk-ota
        to: blk-ota
        label: отклонение обновления
      - id: a-8
        from: blk-ota
        to: blk-ota
        label: запись события безопасности
      - id: a-9
        from: blk-radio
        to: blk-radio
    blocks:
      - id: g-1
        kind: loop
        name: до получения полного образа
        color: '#1E88E5'
        arrows:
          - a-2
      - id: g-2
        kind: cond
        name: подлинность прошивки подтверждена
        arrows:
          - a-3
          - a-4
          - a-5
          - a-6
          - a-7
          - a-8
        thenLabel: нормальное обновление
  - id: seq-2
    name: Выполнение миссии и критичных команд
    lifelines:
      - ext-shore
      - ext-2
      - blk-radio
      - dom-2
      - dom-7
      - blk-gps-ins
      - blk-nav
      - blk-ai
      - blk-avoid
      - dom-1
      - blk-cargo
      - dom-6
      - dom-cargo-cmd
      - dom-8
      - ext-lock
    arrows:
      - id: a-19
        from: ext-2
        to: ext-lock
      - id: a-1
        from: ext-shore
        to: ext-2
        label: передача новой миссии
      - id: a-2
        from: ext-2
        to: blk-radio
        label: приём миссии на борту
      - id: a-3
        from: blk-radio
        to: blk-nav
        label: очищенные данные миссии
      - id: a-4
        from: blk-gps-ins
        to: blk-nav
        label: данные курса и позиции
      - id: a-5
        from: blk-nav
        to: blk-ai
        label: оценка обстановки и планирование маршрута
      - id: a-6
        from: blk-ai
        to: blk-avoid
        label: план манёвра
      - id: a-7
        from: blk-avoid
        to: dom-1
        label: контроль AIS
      - id: a-8
        from: blk-avoid
        to: blk-nav
        label: корректировка маршрута
      - id: a-9
        from: blk-nav
        to: blk-cargo
        label: маршрутный лист
      - id: a-10
        from: blk-cargo
        to: dom-6
        label: критичная команда выгрузки
      - id: a-11
        from: dom-cargo-cmd
        to: dom-8
        label: блокировка движения при нарушении
      - id: a-12
        from: dom-2
        to: dom-2
        label: контроль подлинности миссии
      - id: a-13
        from: dom-2
        to: dom-7
        label: событие безопасности
      - id: a-14
        from: dom-7
        to: blk-radio
        label: цифровая подпись исходящих данных
      - id: a-20
        from: blk-radio
        to: ext-2
      - id: a-15
        from: ext-2
        to: ext-lock
        label: заявка на шлюзование
      - id: a-16
        from: ext-lock
        to: ext-2
        label: разрешение шлюзования
      - id: a-21
        from: ext-2
        to: blk-radio
      - id: a-17
        from: blk-radio
        to: ext-2
        label: отчёт о выполнении миссии
      - id: a-18
        from: ext-2
        to: ext-shore
        label: доставка отчёта берегу
    blocks:
      - id: g-1
        kind: loop
        name: контроль обстановки по ходу миссии
        color: '#1E88E5'
        arrows:
          - a-4
          - a-5
          - a-6
          - a-7
          - a-8
      - id: g-2
        kind: cond
        name: критических нарушений в системе управления не выявлено
        arrows:
          - a-9
          - a-10
          - a-11
          - a-12
          - a-13
          - a-14
          - a-15
          - a-16
          - a-17
          - a-18
        thenLabel: нормальное выполнение миссии
        elseLabel: аварийная остановка
        elseFrom: a-13
  - id: seq-3
    name: Безопасная навигация и расхождение
    lifelines:
      - ext-1
      - blk-lidar
      - blk-cam
      - blk-vision
      - blk-gps-ins
      - blk-nav
      - dom-3
      - dom-4
      - blk-ai
      - blk-avoid
    arrows:
      - id: a-1
        from: ext-1
        to: blk-lidar
        label: облако точек
      - id: a-2
        from: ext-1
        to: blk-cam
        label: видеопоток
      - id: a-3
        from: ext-1
        to: blk-gps-ins
        label: навигационное решение
      - id: a-4
        from: blk-lidar
        to: blk-vision
        label: облако точек
      - id: a-5
        from: blk-cam
        to: blk-vision
        label: видеопоток
      - id: a-6
        from: blk-vision
        to: blk-ai
        label: распознанная обстановка
      - id: a-7
        from: blk-gps-ins
        to: blk-nav
        label: данные курса и позиции
      - id: a-8
        from: blk-nav
        to: dom-3
        label: комплексирование и контроль положения
      - id: a-9
        from: dom-3
        to: dom-4
        label: передача контроля положения
      - id: a-10
        from: blk-lidar
        to: dom-4
        label: данные лидара для расхождения
      - id: a-11
        from: blk-ai
        to: blk-avoid
        label: план манёвра уклонения
      - id: a-12
        from: blk-avoid
        to: blk-nav
        label: корректировка маршрута
      - id: a-13
        from: dom-4
        to: dom-4
        label: расчёт манёвра уклонения
      - id: a-14
        from: blk-nav
        to: blk-nav
        label: продолжение маршрута
    blocks:
      - id: g-1
        kind: loop
        name: мониторинг обстановки
        color: '#1E88E5'
        arrows:
          - a-1
          - a-2
          - a-3
          - a-4
          - a-5
          - a-6
      - id: g-2
        kind: cond
        name: обнаружена угроза столкновения
        arrows:
          - a-7
          - a-8
          - a-9
          - a-10
          - a-11
          - a-12
          - a-13
          - a-14
        thenLabel: уклонение
        elseLabel: штатное движение
        elseFrom: a-14
