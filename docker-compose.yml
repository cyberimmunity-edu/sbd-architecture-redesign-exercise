# Сценарий В3 (раздел 10.1 ТЗ): локальный запуск в Docker для учебного класса.
# Запуск: make docker-build && make docker-start   либо   docker compose up --build
# Порт хоста задаётся переменной PORT (по умолчанию 8080).

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: "0.01.07"
        BASE_PATH: "/"
    image: skib-lab:0.01.07
    container_name: skib-lab
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
