    cost: 2
    position: { x: 1790, y: 431 }
  - id: blk-radio
    name: "10. Радиосвязь"
    cost: 2
    group: lg-1
    position: { x: 530, y: 314 }
  - id: ext-shore
    name: "Береговой пост (СУДС)"
    cost: 0
    external: true
    trusted: true
    position: { x: 80, y: 373 }
  - id: ext-lock
    name: "Оператор шлюза"
    cost: 0
    external: true
    position: { x: 2660, y: 314 }
edges:
  - id: e-shore-radio
    from: ext-shore
    to: blk-radio
    label: "судоходная обстановка"
  - id: e-lock-radio
    from: ext-lock
    to: blk-radio
    label: "разрешение шлюзования"
  - id: e-radio-nav
    from: blk-radio
    to: blk-nav
    label: "очищенные данные"
  - id: e-radio-ota
    from: blk-radio
    to: blk-ota
    label: "пакеты обновлений (OTA)"
  - id: e-radio-lock
    from: blk-radio
    to: ext-lock
    label: "заявка на шлюзование"
  - id: e-gps-nav
    from: blk-gps-ins
    to: blk-nav
    label: "навигационное решение"
  - id: e-cam-vision
    from: blk-cam
    to: blk-vision
    label: "видеопоток"
  - id: e-lidar-vision
    from: blk-lidar
    to: blk-vision
    label: "облако точек"
  - id: e-vision-ai
    from: blk-vision
    to: blk-ai
    label: "распознанная обстановка"
  - id: e-nav-ai
    from: blk-nav
    to: blk-ai
    label: "данные курса и позиции"
  - id: e-ai-avoid
    from: blk-ai
    to: blk-avoid
    label: "план манёвра"
  - id: e-avoid-nav
    from: blk-avoid
    to: blk-nav
    label: "корректировка маршрута"
  - id: e-nav-cargo
    from: blk-nav
    to: blk-cargo
    label: "маршрутный лист"
  - id: e-cargo-shore
    from: blk-cargo
    to: ext-shore
    label: "статус груза"
  - id: e-ota-nav
    from: blk-ota
    to: blk-nav
    label: "установленная прошивка"
  - id: e-ota-ai
    from: blk-ota
    to: blk-ai
    label: "обновление моделей ИИ"
groups:
  # Логические группы (v0.02.03, Ф-70…Ф-76): связь и позиционирование,
  # сенсорный контур и «Бортовой интеллект» с вложенной «Оценкой обстановки»
  # (Ф-71, глубина 2). Цвета — из палитры П-15 без красного/жёлтого/зелёного.
  - id: lg-1
    name: "Связь и позиционирование"
    color: "#1E88E5"
  - id: lg-2
    name: "Сенсорный контур"
    color: "#00897B"
  - id: lg-3
    name: "Бортовой интеллект"
    color: "#8E24AA"
  - id: lg-4
    name: "Оценка обстановки"
    color: "#D81B60"
    parent: lg-3
